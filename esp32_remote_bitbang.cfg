# ============================================================
#  ESP32 无线 SWD 桥接接口配置 (OpenOCD remote_bitbang)
#  配合 ESP32 上的 remote_bitbang 固件使用：
#    ESP32 开热点 192.168.4.1，监听 TCP 端口 3335
#  接线：ESP32 GPIO(SWDIO) -> STM32 PA13
#        ESP32 GPIO(SWCLK) -> STM32 PA14
#        GND -> GND
#  !!! 使用无线烧录时，ST-Link 必须从 SWD 引脚断开（二选一）!!!
# ============================================================
adapter driver remote_bitbang
remote_bitbang host 192.168.4.1
remote_bitbang port 3335

# SWD 双线协议（SWDIO/SWCLK）
transport select swd

# 无线 bit-bang 速度：每个位都是走网络往返，建议不超过 1000kHz
# 若烧录不稳定/超时，可继续调低到 100 或 50
adapter speed 1000

