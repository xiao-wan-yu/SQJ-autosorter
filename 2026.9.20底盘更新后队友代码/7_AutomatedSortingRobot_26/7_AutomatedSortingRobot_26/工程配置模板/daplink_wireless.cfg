# ============================================================
#  成品无线 DAP-Link 套装接口配置
#  电脑端 DAP-Link 插 USB -> 枚举为 CMSIS-DAP 调试器
#  板端 DAP-Link 接 STM32 SWD (PA13=SWDIO / PA14=SWCLK / GND / 3V3)
#  两个 DAP-Link 之间自动无线配对，无线链路对 OpenOCD 完全透明
#  使用本配置时不需要 ESP32、不需要开热点
# ============================================================
adapter driver cmsis-dap
transport select swd

# 无线链路不稳定，SWD 速度不能设太高，否则烧录/调试会超时失败
# 注意：stm32f4x.cfg 里读取的是 CLOCK_FREQ（无下划线）变量，默认 4000kHz，
# 必须在这里预定义它，才能让 target 配置加载时使用低速
#
# 【速度优化 2026-08-18】原来 100kHz 太慢（135KB 固件要传很久，约几十秒）。
# 已提高到 500kHz（约快 5 倍）。如果无线烧录出现超时/失败，
# 把下面两个 500 一起改回 100 即可恢复最稳状态。
set CLOCK_FREQ 500
adapter speed 500

# 无线 DAP-Link 一般不接复位线，禁止使用 SRST/TRST
reset_config none
